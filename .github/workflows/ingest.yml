name: Ingestion Hebdomadaire GTFS

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy requests

    # Ancienne base SQLite (API FastAPI) : conservée le temps de la transition vers l'API Go.
    - name: Exécuter l'ingestion GTFS (SQLite, ancienne API)
      continue-on-error: true
      run: |
        python ingest_sncf_gtfs.py

    # Conversion NeTEx → GTFS pour les opérateurs italiens
    - name: Convertir les NeTEx italiens (Trenitalia + Italo)
      run: python Trenitalia/ingest_trenitalia.py

    # Conversion pour UK (optionnel, nécessite NR_EMAIL / NR_PASSWORD)
    - name: Convertir le GTFS UK (National Rail)
      continue-on-error: true
      env:
        NR_EMAIL: ${{ secrets.NR_EMAIL }}
        NR_PASSWORD: ${{ secrets.NR_PASSWORD }}
      run: python UK/ingest_uk_gtfs.py

    - name: Compiler le réseau pour le moteur de routage (network.bin)
      run: |
        python build_network.py --refresh

    - name: Commit et push des fichiers générés
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add network.bin.gz harmonization_report.json
        git add gtfs_indexed.db.gz || true
        git commit -m "Auto-update: Mise à jour GTFS harmonisé" || exit 0
        git push
