name: Ingestion Hebdomadaire GTFS

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests

    - name: Exécuter l'ingestion GTFS
      run: |
        python ingest_sncf_gtfs.py

    - name: Commit et push du fichier harmonisé
      run: |
        git config --global user.name 'github-actions[bot]'
        git config --global user.email 'github-actions[bot]@users.noreply.github.com'
        git add harmonized_gtfs.db.gz harmonization_report.json
        git commit -m "Auto-update: Mise à jour GTFS harmonisé" || exit 0
        git push