name: Ingestion Hebdomadaire GTFS Eurostar

on:
  schedule:
    - cron: '0 4 * * 0'
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests

    - name: Exécuter l'ingestion GTFS Eurostar
      run: |
        cd EUROSTAR
        python ingest_eurostar_gtfs.py

    - name: Commit et Push du fichier EUROSTAR/eurostar.db.gz
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -f EUROSTAR/eurostar.db.gz
        git commit -m "Auto-update: Mise à jour GTFS Eurostar (EUROSTAR/eurostar.db.gz)" || exit 0
        git push