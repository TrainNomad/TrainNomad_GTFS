name: Ingestion Hebdomadaire GTFS SNCF

on:
  schedule:
    - cron: '0 3 * * 0'
  workflow_dispatch:

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
    - name: Récupérer le code du dépôt
      uses: actions/checkout@v4

    - name: Configurer Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.13'

    - name: Installer les dépendances
      run: |
        python -m pip install --upgrade pip
        pip install pandas requests

    - name: Exécuter l'ingestion GTFS SNCF
      run: |
        python SNCF/ingest_sncf_gtfs.py

    - name: Vérifier la présence du fichier généré
      run: |
        ls -la SNCF/

    - name: Commit et Push du fichier SNCF/sncf.db.gz
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add -f SNCF/sncf.db.gz
        git commit -m "Auto-update: Mise à jour GTFS SNCF (SNCF/sncf.db.gz)" || exit 0
        git push